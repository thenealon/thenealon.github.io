<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
<title>Cyclic Pianos</title>
<style>
  /* --- Global Styles --- */
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    background: #e4e4e4; margin: 0; padding: 10px;
    touch-action: none; user-select: none; -webkit-tap-highlight-color: transparent; 
  }

  /* --- Splash Screen --- */
  #splash {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #111111; color: #FFB81C; 
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 9999; transition: opacity 0.4s ease;
  }
  #splash h1 { font-size: 3rem; margin: 0 0 10px 0; text-align: center; }
  #splash p { font-size: 1.2rem; color: #fdfdfd; margin-bottom: 30px; }
  #start-btn {
    background: #FFB81C; color: #111; border: none; padding: 15px 30px;
    font-size: 1.2rem; font-weight: bold; border-radius: 8px; cursor: pointer;
    box-shadow: 0 4px 10px rgba(255, 184, 28, 0.3); transition: transform 0.1s;
  }
  #start-btn:active { transform: scale(0.95); }

  /* --- Header & Controls --- */
  header { text-align: center; color: #111; margin-bottom: 15px; }
  header h1 { margin: 0; font-size: 1.8rem; color: #111; }
  header p { margin: 4px 0; font-size: 0.95rem; opacity: 0.9; color: #444; }
  header a { color: #D49A18; text-decoration: none; font-weight: bold; }
  
  #controls {
    background: #fdfdfd; color: #111; padding: 10px 15px; border-radius: 12px;
    margin-bottom: 15px; text-align: center; box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    width: 100%; max-width: 650px; box-sizing: border-box; border-top: 4px solid #FFB81C; 
  }
  .control-row { margin-top: 8px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px; }
  .control-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee; }
  
  /* --- Canvas Layout --- */
  #canvas-container {
    display: flex; flex-direction: row; flex-wrap: nowrap; gap: 10px;
    justify-content: center; align-items: flex-start; width: 100%; max-width: 900px;
  }
  .canvas-wrapper { flex: 1 1 50%; display: flex; justify-content: center; max-width: 400px; }
  canvas {
    background: transparent; outline: none; 
    filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
    width: 100%; height: auto; aspect-ratio: 1 / 1;
  }
  #keyboard { cursor: pointer; }
  #graph { cursor: default; }
  
  /* --- UI Helpers --- */
  .hint { margin-top: 8px; font-size: 0.8em; color: #555; font-style: italic; }
  .sustain-active { background-color: #FFB81C !important; color: #000; border-radius: 6px; padding: 2px 6px; }
  label[for="autoplay-toggle"] { color: #008000; }
  label[for="shepard-toggle"] { color: #d00; }
  label[for="mobius-toggle"] { color: #800080; }
</style>
</head>
<body>

  <div id="splash">
    <h1>Cyclic Pianos</h1>
    <p>Bridges 2026 &mdash; N. Bushaw &mdash; (Updated 13 May 2026)</p>
    <button id="start-btn">Start Exploring</button>
  </div>

  <header>
    <h1>Cyclic Pianos</h1>
    <p>N. Bushaw &mdash; Bridges2026 &mdash; <span id="contact"></span></p>
  </header>

  <div id="controls">
    <div class="control-row">
      <label>Notes (N): <strong id="n-val">12</strong></label>
      <input type="range" id="n-slider" min="5" max="31" value="12">
    </div>
    <div class="control-row">
      <label>Black Keys (K): <strong id="k-val">6</strong></label>
      <input type="range" id="k-slider" min="1" max="15" value="6">
    </div>
    
    <div class="control-group">
      <div><input type="checkbox" id="qwerty-toggle"><label for="qwerty-toggle" style="cursor:pointer; font-size: 0.9em;">QWERTY</label></div>
      <div><input type="checkbox" id="integer-toggle"><label for="integer-toggle" style="cursor:pointer; font-size: 0.9em;">Numbers</label></div>
      <div><input type="checkbox" id="distances-toggle" checked><label for="distances-toggle" style="cursor:pointer; font-size: 0.9em;">Distances</label></div>
      <div><input type="checkbox" id="polygons-toggle" checked><label for="polygons-toggle" style="cursor:pointer; font-size: 0.9em;">Polygons</label></div>
      <div id="sustain-container"><input type="checkbox" id="sustain-toggle"><label for="sustain-toggle" style="cursor:pointer; font-size: 0.9em; font-weight: bold;">Sustain</label></div>
      <div><input type="checkbox" id="autoplay-toggle"><label for="autoplay-toggle" style="cursor:pointer; font-size: 0.9em; font-weight: bold;">Auto-Play</label></div>
      <div><input type="checkbox" id="shepard-toggle"><label for="shepard-toggle" style="cursor:pointer; font-size: 0.9em; font-weight: bold;">Shepard</label></div>
      <div><input type="checkbox" id="mobius-toggle"><label for="mobius-toggle" style="cursor:pointer; font-size: 0.9em; font-weight: bold;">Möbius</label></div>
    </div>
    <div class="hint">Toggle <strong>Möbius + Shepard + Auto-Play</strong> to see all the bells and whistles!</div>
  </div>

  <div id="canvas-container">
    <div class="canvas-wrapper"><canvas id="keyboard" width="400" height="400" tabindex="0"></canvas></div>
    <div class="canvas-wrapper"><canvas id="graph" width="400" height="400"></canvas></div>
  </div>

  <script>
    // --- Setup & Initialization ---
    (function() {
      const u = "nobushaw", d = "vcu.edu";
      document.getElementById('contact').innerHTML = `<a href="mailto:${u}@${d}">${u}@${d}</a>`;
    })();

    const canvas = document.getElementById('keyboard'), ctx = canvas.getContext('2d');
    const graphCanvas = document.getElementById('graph'), gCtx = graphCanvas.getContext('2d');

    const nSlider = document.getElementById('n-slider'), kSlider = document.getElementById('k-slider');
    const qwertyToggle = document.getElementById('qwerty-toggle'), integerToggle = document.getElementById('integer-toggle');
    const distancesToggle = document.getElementById('distances-toggle'), polygonsToggle = document.getElementById('polygons-toggle');
    const sustainToggle = document.getElementById('sustain-toggle'), sustainContainer = document.getElementById('sustain-container');
    const autoplayToggle = document.getElementById('autoplay-toggle'), shepardToggle = document.getElementById('shepard-toggle'), mobiusToggle = document.getElementById('mobius-toggle');

    let N = 12, K = 6;
    let showQwerty = false, showInteger = false, showDistances = true, showPolygons = true, showMobius = false;
    let keys = [], isBlackArr = []; 

    let audioCtx = null, audioUnlocked = false, nextVoiceId = 0;
    const activeVoices = new Map(), sustainedVoices = new Set();
    const pointerToVoice = new Map(), keyToVoice = new Map();
    const activePointers = new Set(), pressedKeys = new Set();
    let isSustainDown = false, autoplayInterval = null, arpIndex = 0, arpVoiceId = null;

    const cx = 200, cy = 200, gx = 200, gy = 200, rGraph = 160;
    const noteNames12 = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

    // --- Graph Distance Logic ---
    function getGraphDist(u, v) {
      let limit = showMobius ? N * 2 : N;
      let d_cycle = Math.min(Math.abs(u - v), limit - Math.abs(u - v));
      if (showMobius) {
        let u_jump = (u + N) % limit;
        let d_jump = 1 + Math.min(Math.abs(u_jump - v), limit - Math.abs(u_jump - v));
        return Math.min(d_cycle, d_jump);
      }
      return d_cycle;
    }

    function findOptimalMobiusBlackKeys(N, K) {
      let limit = 2 * N;
      let numBlack = K; // Directly use total black keys
      let distMap = Array(limit).fill(0).map(()=>Array(limit).fill(0));
      
      for(let i=0; i<limit; i++) {
        for(let j=0; j<limit; j++) {
          let d_cycle = Math.min(Math.abs(i - j), limit - Math.abs(i - j));
          let i_jump = (i + N) % limit;
          let d_jump = 1 + Math.min(Math.abs(i_jump - j), limit - Math.abs(i_jump - j));
          distMap[i][j] = i === j ? 0 : Math.min(d_cycle, d_jump);
        }
      }

      function getE(arr) {
        let e = 0;
        for(let i=0; i<limit; i++) {
          if(!arr[i]) continue;
          for(let j=i+1; j<limit; j++) {
            if(arr[j]) e += 1.0 / distMap[i][j];
          }
        }
        return e;
      }

      function isValid(arr) {
        for(let i=0; i<N; i++) {
          if(arr[i] && arr[(i+1)%N]) return false;
        }
        for(let i=0; i<N; i++) {
          let u = N + i, v = N + (i+1)%N;
          if(arr[u] && arr[v]) return false;
        }
        return true;
      }

      let bestArr = Array(limit).fill(false);
      for (let i = 0; i < numBlack; i++) {
        bestArr[(Math.floor((i * limit) / numBlack) + 1) % limit] = true;
      }
      if (!isValid(bestArr)) {
        bestArr.fill(false);
        for(let i=0; i<numBlack; i++) bestArr[i*2] = true;
      }

      let globalBestArr = [...bestArr];
      let globalBestE = getE(bestArr);

      for(let restart=0; restart<3; restart++) {
        let currArr = [...bestArr];
        if (restart > 0) {
          currArr.fill(false);
          let c = 0;
          while(c < numBlack) {
            let idx = Math.floor(Math.random() * limit);
            if(!currArr[idx]) {
              currArr[idx] = true;
              if(!isValid(currArr)) currArr[idx] = false;
              else c++;
            }
          }
        }

        let currE = getE(currArr);
        let improved = true;
        while(improved) {
          improved = false;
          for(let i=0; i<limit; i++) {
            if(!currArr[i]) continue;
            for(let j=0; j<limit; j++) {
              if(currArr[j]) continue;
              
              currArr[i] = false; currArr[j] = true;
              if(isValid(currArr)) {
                let delta = 0;
                for(let k=0; k<limit; k++) {
                  if(currArr[k] && k !== j) {
                    delta -= 1.0 / distMap[i][k];
                    delta += 1.0 / distMap[j][k];
                  }
                }
                if(delta < -1e-7) {
                  currE = getE(currArr);
                  improved = true;
                  break;
                }
              }
              currArr[i] = true; currArr[j] = false; // backtrack
            }
            if(improved) break;
          }
        }
        if (currE < globalBestE) {
          globalBestE = currE;
          globalBestArr = [...currArr];
        }
      }
      return globalBestArr;
    }

    // --- Audio System Unlock ---
    const splash = document.getElementById('splash'), startBtn = document.getElementById('start-btn');
    function unlockAudio() {
      if (audioUnlocked) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
      const buffer = audioCtx.createBuffer(1, 1, 22050), source = audioCtx.createBufferSource();
      source.buffer = buffer; source.connect(audioCtx.destination); source.start(0);
      if (audioCtx.state === 'suspended') audioCtx.resume();
      audioUnlocked = true;
    }

    startBtn.addEventListener('click', () => {
      unlockAudio();
      splash.style.opacity = '0';
      setTimeout(() => { splash.style.display = 'none'; }, 400); 
    });

    // --- Keyboard Math & Geometry ---
    function updateKeyboard() {
      showMobius = mobiusToggle.checked;
      showQwerty = qwertyToggle.checked; showInteger = integerToggle.checked;
      showDistances = distancesToggle.checked; showPolygons = polygonsToggle.checked;

      // Handle the slider as TOTAL keys
      let requestedTotal = parseInt(nSlider.value);
      if (showMobius && requestedTotal % 2 !== 0) {
        requestedTotal++; // Force even for Möbius
        if (requestedTotal > parseInt(nSlider.max)) requestedTotal -= 2;
        nSlider.value = requestedTotal;
      }
      let totalKeys = requestedTotal;
      
      // N acts as keys-per-ring to preserve mathematical integrity
      N = showMobius ? totalKeys / 2 : totalKeys; 

      // Black keys must be the minority set globally (<= totalKeys / 2)
      const maxK = Math.floor(totalKeys / 2);
      kSlider.max = maxK;
      if (parseInt(kSlider.value) > maxK) kSlider.value = maxK;
      K = parseInt(kSlider.value); // K is now TOTAL black keys
      
      document.getElementById('n-val').innerText = totalKeys; 
      document.getElementById('k-val').innerText = K;

      let limitKeys = totalKeys;
      isBlackArr = Array(limitKeys).fill(false);
      let standardPianoMap = null;

      if (!showMobius) {
        if (N === 12 && K === 5) {
          [1, 3, 6, 8, 10].forEach(i => isBlackArr[i] = true);
          standardPianoMap = {0:'a', 1:'w', 2:'s', 3:'e', 4:'d', 5:'f', 6:'t', 7:'g', 8:'y', 9:'h', 10:'u', 11:'j'};
        } else {
          for (let i = 0; i < K; i++) isBlackArr[(Math.floor((i * N) / K) + 1) % N] = true;
        }
      } else {
        isBlackArr = findOptimalMobiusBlackKeys(N, K);
      }

      const fW_out = ['a','s','d','f','g','h','j','k','l',';',"'"];
      const fB_out = ['w','e','r','t','y','u','i','o','p','[',']'];
      const fW_in = ['z','x','c','v','b','n','m',',','.','/'];
      const fB_in = ['1','2','3','4','5','6','7','8','9','0','-','='];

      keys = [];
      let numRings = showMobius ? 2 : 1;
      
      let ringProps = showMobius 
        ? [ 
            { rwOut: 190, rwIn: 114, rbOut: 154, rbIn: 114 }, // Outer Ring
            { rwOut: 110, rwIn: 35,  rbOut: 110, rbIn: 70 }   // Inner Ring (Inverted)
          ]
        : [ 
            { rwOut: 190, rwIn: 35,  rbOut: 110, rbIn: 35 }   // Standard Mode
          ];

      for (let ring = 0; ring < numRings; ring++) {
        // Calculate W and Angle logic per ring to support uneven black key distributions
        let k_ring = 0;
        for (let i = 0; i < N; i++) {
          if (isBlackArr[i + ring * N]) k_ring++;
        }
        let W = N - k_ring;
        let angleW = (Math.PI * 2) / W;
        let blackWidth = angleW * 0.55;
        let rotationOffset = -angleW / 2;

        let currentWhite = 0, wIdx = 0, bIdx = 0;
        let props = ringProps[ring];
        
        for (let i = 0; i < N; i++) {
          let logicalIndex = i + ring * N;
          let isB = isBlackArr[logicalIndex];
          let ql = "";
          
          if (ring === 0) {
            ql = standardPianoMap ? standardPianoMap[i] : (isB ? fB_out[bIdx++ % 11] : fW_out[wIdx++ % 11]);
          } else {
            ql = isB ? fB_in[bIdx++ % 12] : fW_in[wIdx++ % 10];
          }

          let labRad;
          if (isB) {
            labRad = props.rbOut - 15; 
          } else {
            labRad = (ring === 1 && showMobius) ? props.rwIn + 22 : props.rwOut - 22;
          }

          if (isB) {
            keys.push({ index: logicalIndex, isBlack: true, center: currentWhite * angleW + rotationOffset, width: blackWidth, rOuter: props.rbOut, rInner: props.rbIn, qwertyLabel: ql, labelRadius: labRad });
          } else {
            keys.push({ index: logicalIndex, isBlack: false, start: currentWhite * angleW + rotationOffset, end: (currentWhite + 1) * angleW + rotationOffset, whiteIndex: currentWhite, rOuter: props.rwOut, rInner: props.rwIn, qwertyLabel: ql, labelRadius: labRad });
            currentWhite++;
          }
        }
      }
      draw();
    }

    // --- Canvas Drawing Logic ---
    function drawWedge(rInner, rOuter, logicalStart, logicalEnd, color) {
      ctx.beginPath(); 
      ctx.arc(cx, cy, rOuter, Math.PI / 2 - logicalEnd, Math.PI / 2 - logicalStart);
      ctx.arc(cx, cy, rInner, Math.PI / 2 - logicalStart, Math.PI / 2 - logicalEnd, true);
      ctx.closePath(); 
      ctx.fillStyle = color; ctx.fill();
      ctx.strokeStyle = '#222'; ctx.lineWidth = 2.5; ctx.stroke();
    }

    const drawArrowHead = (x, y, angle) => {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      
      const stemOverhang = 2; 

      ctx.beginPath();
      ctx.moveTo(9, 0);
      ctx.lineTo(0, -6);
      ctx.lineTo(0, 6);
      ctx.closePath();
      ctx.fillStyle = '#111';
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(8, 0);
      ctx.lineTo(stemOverhang, -4);
      ctx.lineTo(stemOverhang, 4);
      ctx.closePath();
      ctx.fillStyle = '#FFB81C';
      ctx.fill();
      
      ctx.restore();
    };

    const drawHorizontalCurve = (p1, p2) => {
      const pLeft = p1.x < p2.x ? p1 : p2;
      const pRight = p1.x < p2.x ? p2 : p1;
      const cpOffset = Math.max(30, Math.abs(pRight.x - pLeft.x) * 0.5);

      ctx.beginPath();
      ctx.moveTo(pLeft.x, pLeft.y);
      ctx.bezierCurveTo(pLeft.x + cpOffset, pLeft.y, pRight.x - cpOffset, pRight.y, pRight.x, pRight.y);
      ctx.strokeStyle = '#111'; ctx.lineWidth = 6; ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(pLeft.x, pLeft.y);
      ctx.bezierCurveTo(pLeft.x + cpOffset, pLeft.y, pRight.x - cpOffset, pRight.y, pRight.x, pRight.y);
      ctx.strokeStyle = '#FFB81C'; ctx.lineWidth = 3; ctx.stroke();

      drawArrowHead(pLeft.x, pLeft.y, Math.PI); 
      drawArrowHead(pRight.x, pRight.y, 0);     
    };

    function drawMobiusArrows() {
      if (!showMobius) return;

      const keyOutC = keys.find(k => k.index === 0);         
      const keyOutB = keys.find(k => k.index === N - 1);    
      const keyInC  = keys.find(k => k.index === N);         
      const keyInB  = keys.find(k => k.index === 2 * N - 1); 

      if (!keyOutC || !keyOutB || !keyInC || !keyInB) return;

      const getCenterAngle = (k) => k.isBlack ? k.center : (k.start + k.end) / 2;
      const getRadius = (k) => (k.rOuter + k.rInner) / 2; 
      const getPoint = (k) => {
        const ang = Math.PI / 2 - getCenterAngle(k);
        const r = getRadius(k);
        return { x: cx + Math.cos(ang) * r, y: cy + Math.sin(ang) * r };
      };

      const pOutC = getPoint(keyOutC), pOutB = getPoint(keyOutB);
      const pInC  = getPoint(keyInC),  pInB  = getPoint(keyInB);

      drawHorizontalCurve(pOutB, pInC);
      drawHorizontalCurve(pInB, pOutC);
    }

    function drawLabels() {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'bold 15px Georgia, serif'; 
      for (let key of keys) {
        const angle = key.isBlack ? key.center : (key.start + key.end) / 2;
        const tx = cx + Math.cos(Math.PI/2 - angle) * key.labelRadius;
        const ty = cy + Math.sin(Math.PI/2 - angle) * key.labelRadius;
        ctx.fillStyle = key.isBlack ? '#f0f0f0' : '#333';
        let lines = [];
        if (showInteger) lines.push(N === 12 && !showMobius ? noteNames12[key.index % N] : key.index);
        if (showQwerty) lines.push(key.qwertyLabel.toUpperCase());
        if (lines.length === 1) ctx.fillText(lines[0], tx, ty);
        else if (lines.length === 2) { ctx.fillText(lines[0], tx, ty - 8); ctx.fillText(lines[1], tx, ty + 8); }
      }
    }

    function getNodePos(i) {
      if (!showMobius) {
        const a = Math.PI / 2 - i * (Math.PI * 2) / N;
        return { x: gx + Math.cos(a) * rGraph, y: gy + Math.sin(a) * rGraph };
      } else {
        const R = rGraph - 25; 
        const w = 35;          
        const u = Math.PI / 2 - i * (Math.PI * 2) / N; 
        const v = i * Math.PI / N;                     
        const lx = (R + w * Math.cos(v)) * Math.cos(u);
        const ly = (R + w * Math.cos(v)) * Math.sin(u);
        const lz = w * Math.sin(v);
        const tilt = 0.7; 
        return { x: gx + lx, y: gy + ly * Math.cos(tilt) - lz * Math.sin(tilt) };
      }
    }

    function drawGraph(activeIndices) {
      gCtx.clearRect(0, 0, 400, 400);
      const limit = showMobius ? N * 2 : N;

      if (showMobius) {
        gCtx.beginPath();
        for (let i = 0; i < N; i++) {
          const p1 = getNodePos(i); const p2 = getNodePos(i + N);
          gCtx.moveTo(p1.x, p1.y); gCtx.lineTo(p2.x, p2.y);
        }
        gCtx.strokeStyle = 'rgba(34, 34, 34, 0.4)'; gCtx.lineWidth = 1.5; gCtx.stroke();
      }

      gCtx.beginPath();
      for (let i = 0; i <= limit; i++) {
        const p = getNodePos(i % limit);
        i === 0 ? gCtx.moveTo(p.x, p.y) : gCtx.lineTo(p.x, p.y);
      }
      gCtx.strokeStyle = '#222'; gCtx.lineWidth = 2.5; gCtx.stroke();

      const activeArr = Array.from(activeIndices).sort((a, b) => a - b);
      if (activeArr.length > 1) {
        let polyArea = 0, cxSum = 0, cySum = 0;
        
        if (showPolygons) {
          gCtx.beginPath();
          for (let i = 0; i < activeArr.length; i++) {
            const uIdx = activeArr[i], p = getNodePos(uIdx);
            cxSum += p.x; cySum += p.y;
            i === 0 ? gCtx.moveTo(p.x, p.y) : gCtx.lineTo(p.x, p.y);
            const a1 = Math.PI / 2 - uIdx * (Math.PI * 2) / limit;
            const a2 = Math.PI / 2 - activeArr[(i + 1) % activeArr.length] * (Math.PI * 2) / limit;
            polyArea += Math.sin(a1 - a2);
          }
          if (activeArr.length >= 3) { gCtx.closePath(); gCtx.fillStyle = 'rgba(255, 184, 28, 0.3)'; gCtx.fill(); }
          gCtx.strokeStyle = '#FFB81C'; gCtx.lineWidth = 2.5; gCtx.stroke();
        }
        
        if (showDistances) {
          activeArr.forEach((u, i) => {
            activeArr.slice(i+1).forEach(v => {
              const p1 = getNodePos(u), p2 = getNodePos(v);
              gCtx.beginPath(); gCtx.moveTo(p1.x, p1.y); gCtx.lineTo(p2.x, p2.y);
              gCtx.strokeStyle = '#FFB81C'; gCtx.stroke();
              
              const dist = getGraphDist(u, v);
              const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
              
              gCtx.beginPath(); gCtx.arc(mx, my, 8, 0, Math.PI*2); gCtx.fillStyle='#fff'; gCtx.fill();
              gCtx.strokeStyle='#FFB81C'; gCtx.lineWidth=1.5; gCtx.stroke();
              gCtx.fillStyle='#FFB81C'; gCtx.font='bold 10px sans-serif'; gCtx.textAlign='center'; gCtx.fillText(dist, mx, my+3);
            });
          });
        }
        
        if (showPolygons && activeArr.length >= 3) {
          const finalArea = Math.abs(polyArea * 0.5), text = `A=${finalArea.toFixed(2)}`;
          const polyCX = cxSum / activeArr.length, polyCY = cySum / activeArr.length;
          
          gCtx.font = 'bold 12px sans-serif';
          const textWidth = gCtx.measureText(text).width;
          
          gCtx.beginPath();
          gCtx.arc(polyCX - textWidth / 2, polyCY, 10, Math.PI / 2, Math.PI * 1.5);
          gCtx.arc(polyCX + textWidth / 2, polyCY, 10, Math.PI * 1.5, Math.PI / 2);
          gCtx.closePath();
          
          gCtx.fillStyle = '#fff'; gCtx.fill();
          gCtx.strokeStyle = '#FFB81C'; gCtx.lineWidth = 1.5; gCtx.stroke();
          gCtx.fillStyle = '#FFB81C'; gCtx.textAlign = 'center'; gCtx.textBaseline = 'middle'; gCtx.fillText(text, polyCX, polyCY);
        }
      }

      const vRad = Math.max(6, Math.min(18, (rGraph * Math.PI / limit) * 0.7));
      for (let i = 0; i < limit; i++) {
        const p = getNodePos(i);
        gCtx.beginPath(); gCtx.arc(p.x, p.y, vRad, 0, Math.PI * 2);
        
        const active = activeIndices.has(i), isB = isBlackArr[i];
        gCtx.fillStyle = isB ? (active ? '#D49A18' : '#222') : (active ? '#FFB81C' : '#fff'); gCtx.fill(); 
        gCtx.strokeStyle = active ? (isB ? '#fff' : '#111') : '#222'; gCtx.lineWidth = active ? 3 : 2; gCtx.stroke();
        
        if (vRad >= 10) {
          gCtx.fillStyle = isB ? (active ? '#fff' : '#ddd') : (active ? '#000' : '#444');
          gCtx.font = `bold ${Math.max(9, vRad - 4)}px sans-serif`; gCtx.textAlign = 'center'; gCtx.fillText(i, p.x, p.y + 4);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, 400, 400);
      const activeIndices = new Set(Array.from(activeVoices.values()).map(v => v.index));
      
      keys.filter(k => !k.isBlack).forEach(k => drawWedge(k.rInner, k.rOuter, k.start, k.end, activeIndices.has(k.index) ? '#FFB81C' : '#fff'));
      keys.filter(k => k.isBlack).forEach(k => drawWedge(k.rInner, k.rOuter, k.center-k.width/2, k.center+k.width/2, activeIndices.has(k.index) ? '#D49A18' : '#222'));
      
      drawMobiusArrows();
      if (showQwerty || showInteger) drawLabels();
      drawGraph(activeIndices);
    }

    // --- Web Audio Synthesis Engine ---
    function startVoice(index) {
      if (!audioUnlocked) unlockAudio();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

      const masterGain = audioCtx.createGain();
      masterGain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      
      masterGain.gain.setValueAtTime(0, now);
      const targetVolume = shepardToggle.checked ? 0.05 : 0.15;
      masterGain.gain.setTargetAtTime(targetVolume, now, 0.01);

      const oscillators = [];
      const baseFreq = 261.63 * Math.pow(2, index / N);

      if (showMobius && shepardToggle.checked) {
        for (let i = -2; i <= 2; i++) {
          const freq = baseFreq * Math.pow(4, i); 
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          const lfreq = Math.log2(freq / 261.63);
          const volume = Math.exp(-0.5 * Math.pow(lfreq / 2.0, 2)); 
          osc.type = 'sine'; osc.frequency.value = freq; g.gain.value = volume;
          osc.connect(g); g.connect(masterGain); osc.start(now);
          oscillators.push(osc);
        }
      } else if (shepardToggle.checked) {
        for (let i = -3; i <= 3; i++) {
          const freq = baseFreq * Math.pow(2, i);
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          const lfreq = Math.log2(freq / 261.63);
          const volume = Math.exp(-0.5 * Math.pow(lfreq / 1.5, 2)); 
          osc.type = 'sine'; osc.frequency.value = freq; g.gain.value = volume;
          osc.connect(g); g.connect(masterGain); osc.start(now);
          oscillators.push(osc);
        }
      } else {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine'; osc.frequency.value = baseFreq;
        osc.connect(masterGain); osc.start(now);
        oscillators.push(osc);
      }

      const voiceId = nextVoiceId++;
      activeVoices.set(voiceId, { oscillators, gain: masterGain, index });
      requestAnimationFrame(draw); 
      return voiceId;
    }

    function stopVoice(voiceId) {
      if (!activeVoices.has(voiceId)) return;
      const { oscillators, gain } = activeVoices.get(voiceId);
      const now = audioCtx.currentTime;
      gain.gain.cancelScheduledValues(now);
      gain.gain.setValueAtTime(gain.gain.value, now);
      gain.gain.linearRampToValueAtTime(0.0001, now + 0.1); 
      oscillators.forEach(o => o.stop(now + 0.15));
      activeVoices.delete(voiceId);
      sustainedVoices.delete(voiceId);
      requestAnimationFrame(draw);
    }

    function releaseVoice(voiceId) {
      if (isSustainDown) sustainedVoices.add(voiceId);
      else stopVoice(voiceId);
    }

    function handleSustainChange(active) {
      isSustainDown = active; sustainToggle.checked = active;
      if (active) sustainContainer.classList.add('sustain-active');
      else {
        sustainContainer.classList.remove('sustain-active');
        const held = new Set([...pointerToVoice.values(), ...keyToVoice.values()]);
        if (arpVoiceId !== null) held.add(arpVoiceId);
        sustainedVoices.forEach(id => { if (!held.has(id)) stopVoice(id); });
      }
    }

    function handleAutoplayChange(active) {
      if (active) {
        if (!audioUnlocked) unlockAudio();
        arpIndex = 0;
        autoplayInterval = setInterval(() => {
          if (arpVoiceId !== null) releaseVoice(arpVoiceId);
          let limit = showMobius ? N * 2 : N;
          if (arpIndex >= limit) arpIndex = 0;
          arpVoiceId = startVoice(arpIndex);
          arpIndex++;
        }, 350); 
      } else {
        clearInterval(autoplayInterval);
        autoplayInterval = null;
        if (arpVoiceId !== null) { releaseVoice(arpVoiceId); arpVoiceId = null; }
      }
    }

    // --- Input Handling ---
    function getIndexFromClick(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (400/rect.width) - cx, y = (e.clientY - rect.top) * (400/rect.height) - cy;
      const dist = Math.sqrt(x*x + y*y);
      if (dist < 35) return -1; 
      let ang = Math.PI/2 - Math.atan2(y, x);
      if (ang < 0) ang += Math.PI*2; if (ang >= Math.PI*2) ang -= Math.PI*2;
      
      for (let k of keys) {
        if (k.isBlack && dist <= k.rOuter && dist >= k.rInner) {
          let d = Math.abs(ang - k.center); if (d > Math.PI) d = 2*Math.PI - d;
          if (d <= k.width/2) return k.index;
        }
      }
      
      for (let k of keys) {
        if (!k.isBlack && dist <= k.rOuter && dist >= k.rInner) {
          let st = k.start % (2 * Math.PI); if (st < 0) st += 2 * Math.PI;
          let en = k.end % (2 * Math.PI); if (en < 0) en += 2 * Math.PI;
          let inSlice = false;
          if (st < en) inSlice = (ang >= st && ang < en);
          else inSlice = (ang >= st || ang < en);
          if (inSlice) return k.index;
        }
      }
      return -1;
    }

    canvas.addEventListener('pointerdown', (e) => {
      activePointers.add(e.pointerId); canvas.setPointerCapture(e.pointerId);
      const idx = getIndexFromClick(e); if (idx !== -1) pointerToVoice.set(e.pointerId, startVoice(idx));
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!activePointers.has(e.pointerId)) return;
      const nIdx = getIndexFromClick(e), oVid = pointerToVoice.get(e.pointerId);
      const cIdx = oVid !== undefined ? activeVoices.get(oVid).index : -1;
      if (nIdx !== cIdx) { 
        if (oVid !== undefined) { releaseVoice(oVid); pointerToVoice.delete(e.pointerId); }
        if (nIdx !== -1) pointerToVoice.set(e.pointerId, startVoice(nIdx));
      }
    });
    canvas.addEventListener('pointerup', (e) => {
      activePointers.delete(e.pointerId); const vid = pointerToVoice.get(e.pointerId);
      if (vid !== undefined) { releaseVoice(vid); pointerToVoice.delete(e.pointerId); }
    });

    window.addEventListener('keydown', (e) => {
      if (e.repeat || e.metaKey || e.ctrlKey) return;
      if (e.key === ' ') { handleSustainChange(true); e.preventDefault(); return; }
      const matched = keys.find(k => k.qwertyLabel === e.key.toLowerCase());
      if (matched && !pressedKeys.has(e.key.toLowerCase())) {
        pressedKeys.add(e.key.toLowerCase());
        keyToVoice.set(e.key.toLowerCase(), startVoice(matched.index));
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === ' ') { handleSustainChange(false); return; }
      const char = e.key.toLowerCase();
      if (pressedKeys.has(char)) {
        pressedKeys.delete(char); const vid = keyToVoice.get(char);
        if (vid !== undefined) { releaseVoice(vid); keyToVoice.delete(char); }
      }
    });

    nSlider.oninput = updateKeyboard; kSlider.oninput = updateKeyboard;
    qwertyToggle.onchange = updateKeyboard; integerToggle.onchange = updateKeyboard;
    distancesToggle.onchange = updateKeyboard; polygonsToggle.onchange = updateKeyboard;
    sustainToggle.onchange = (e) => handleSustainChange(e.target.checked);
    autoplayToggle.onchange = (e) => handleAutoplayChange(e.target.checked);
    shepardToggle.onchange = updateKeyboard; 
    
    mobiusToggle.onchange = (e) => {
      if (e.target.checked) shepardToggle.checked = true;
      updateKeyboard();
    };
    
    updateKeyboard();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VCU/Pitt Bootstrap Percolation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial, sans-serif; text-align:center; margin:0; padding:0; background:#f7f7f7; }
h1 { margin:10px; }
#controls { margin:10px auto; display:flex; flex-wrap:wrap; justify-content:center; gap:15px; }
.slider-container { display:flex; flex-direction:column; align-items:center; }
canvas { border:2px solid #333; margin:15px auto; display:block; touch-action: none; }
button, select, input[type=file] { margin:5px; padding:6px 12px; border:none; border-radius:6px; cursor:pointer; font-weight:bold; background:#ccc; }
button:hover, select:hover, input[type=file]:hover { opacity:0.85; }
label.toggle-label { display:flex; align-items:center; gap:5px; font-weight:bold; }
#roundsLabelDisplay { font-weight:bold; margin-left:5px; }
</style>
</head>
<body>
<h1 id="title">VCU Infection Simulation</h1>

<div id="controls">
  <div class="slider-container"><label>Rows: <span id="rowsLabel">50</span></label><input type="range" id="rowsSlider" min="5" max="200" value="50"></div>
  <div class="slider-container"><label>Cols: <span id="colsLabel">50</span></label><input type="range" id="colsSlider" min="5" max="200" value="50"></div>
  <div class="slider-container"><label>Infection Prob: <span id="probLabel">0.5</span></label><input type="range" id="probSlider" min="0" max="1" step="0.01" value="0.5"></div>
  <div class="slider-container"><label>Threshold (0–4): <span id="thresholdLabel">2</span></label><input type="range" id="thresholdSlider" min="0" max="4" value="2"></div>
  <div class="slider-container"><label>Speed(ms/step): <span id="speedLabel">300</span></label><input type="range" id="speedSlider" min="50" max="1000" step="50" value="300"></div>
  <div class="slider-container"><label class="toggle-label"><input type="checkbox" id="torusVert"> Vertical Wrap</label></div>
  <div class="slider-container"><label class="toggle-label"><input type="checkbox" id="torusHoriz"> Horizontal Wrap</label></div>
</div>

<div>
<button onclick="toggleInfection()">Start/Stop Infection</button>
<button onclick="randomInfect()">Random Infection</button>
<button onclick="switchTeams()">Switch Teams</button>
<button id="logoButton" onclick="infectLogo()">VCU</button>
<button onclick="juliaInfect()">Julia Set</button>
<select id="patternSelect" onchange="patternInfect()">
  <option value="">--Other Patterns--</option>
  <option value="checkerboard">Checkerboard</option>
  <option value="diagonals">Diagonals</option>
  <option value="primes">Primes</option>
</select>
<input type="file" id="imageUpload" accept="image/*">
<span>Rounds: <span id="roundsLabelDisplay">0</span></span>
</div>

<canvas id="gridCanvas"></canvas>

<script>
const canvas = document.getElementById("gridCanvas");
const ctx = canvas.getContext("2d");

let rows=50, cols=50, prob=0.5, threshold=2, speed=300, running=false, rounds=0;
let grid = [];
let infectionInterval;
let team="VCU";
let colors = {bg:"#ffb300", infected:"#000"};

function initGrid(){ 
  grid = Array(rows).fill().map(()=>Array(cols).fill(false)); 
  rounds=0; 
  document.getElementById("roundsLabelDisplay").textContent=rounds; 
  drawGrid(); 
}

function cellSize(){ return Math.floor(Math.min(window.innerWidth*0.9/cols, (window.innerHeight-300)/rows)); }

function drawGrid(){
  const size = cellSize(); 
  canvas.width=cols*size; canvas.height=rows*size;
  ctx.fillStyle = colors.bg; ctx.fillRect(0,0,canvas.width,canvas.height);
  const vertWrap = document.getElementById("torusVert").checked; 
  const horizWrap = document.getElementById("torusHoriz").checked;
  const hintAlpha = 0.15;
  if(vertWrap || horizWrap){
    ctx.globalAlpha=hintAlpha; 
    for(let dr=-1;dr<=1;dr++){for(let dc=-1;dc<=1;dc++){if(dr===0 && dc===0) continue; for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){if(grid[r][c]){const rr=r+dr*rows; const cc=c+dc*cols; if(rr>=0 && rr<rows && cc>=0 && cc<cols){ctx.fillStyle=colors.infected;ctx.fillRect(cc*size,rr*size,size,size);}}}}}} 
    ctx.globalAlpha=1.0;
  }
  ctx.strokeStyle="#444"; ctx.lineWidth=0.5;
  for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){ctx.strokeRect(c*size,r*size,size,size); if(grid[r][c]){ctx.fillStyle=colors.infected;ctx.fillRect(c*size,r*size,size,size);}}}
}

function countNeighbors(r,c){
  const vertWrap = document.getElementById("torusVert").checked; 
  const horizWrap = document.getElementById("torusHoriz").checked;
  let count=0;
  let nr=r-1; if(nr<0 && vertWrap) nr=rows-1; if(nr>=0 && nr<rows && grid[nr][c]) count++;
  nr=r+1; if(nr>=rows && vertWrap) nr=0; if(nr>=0 && nr<rows && grid[nr][c]) count++;
  let nc=c-1; if(nc<0 && horizWrap) nc=cols-1; if(nc>=0 && nc<cols && grid[r][nc]) count++;
  nc=c+1; if(nc>=cols && horizWrap) nc=0; if(nc>=0 && nc<cols && grid[r][nc]) count++;
  return count;
}

function stepInfection(){
  let newGrid = grid.map(r=>r.slice()); let changed=false;
  for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){if(!grid[r][c] && countNeighbors(r,c)>=threshold){newGrid[r][c]=true;changed=true;}}}
  if(!changed){ clearInterval(infectionInterval); running=false; return; }
  grid=newGrid; rounds++; document.getElementById("roundsLabelDisplay").textContent=rounds; drawGrid();
}

function toggleInfection(){ if(running){clearInterval(infectionInterval);running=false;} else{infectionInterval=setInterval(stepInfection,speed);running=true;} }

function randomInfect(){for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){grid[r][c]=Math.random()<prob;}} rounds=0; document.getElementById("roundsLabelDisplay").textContent=rounds; drawGrid();}

function switchTeams(){
  if(team==="VCU"){team="Pitt"; colors={bg:"#003594",infected:"#ffb81c"}; document.getElementById("title").textContent="Pitt Infection Simulation"; document.getElementById("logoButton").textContent="PITT";}
  else{team="VCU"; colors={bg:"#ffb300",infected:"#000"}; document.getElementById("title").textContent="VCU Infection Simulation"; document.getElementById("logoButton").textContent="VCU";}
  drawGrid();
}

function infectLogo(){
  initGrid();
  const temp=document.createElement("canvas"); const tctx=temp.getContext("2d");
  temp.width=cols; temp.height=rows; tctx.fillStyle="black"; tctx.textAlign="center"; tctx.textBaseline="middle";
  tctx.font = `${Math.min(rows,cols)*0.6}px ${team==="VCU"?"sans-serif":"cursive"}`;
  tctx.fillText(team, cols/2, rows/2);
  const data=tctx.getImageData(0,0,cols,rows).data;
  for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){const idx=(r*cols+c)*4;if(data[idx+3]>128) grid[r][c]=true;}}
  rounds=0; document.getElementById("roundsLabelDisplay").textContent=rounds; drawGrid();
}

// Julia fractal denser
function juliaInfect(){
  initGrid();
  const cx=Math.random()*2-1; const cy=Math.random()*2-1; const maxIter=20;
  for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){
    let zx=3*(c/cols-0.5), zy=2*(r/rows-0.5), iter=0;
    while(zx*zx+zy*zy<4 && iter<maxIter){let tmp=zx*zx-zy*zy+cx; zy=2*zx*zy+cy; zx=tmp; iter++;}
    if(iter>=maxIter/2) grid[r][c]=true; // denser
  }} rounds=0; document.getElementById("roundsLabelDisplay").textContent=rounds; drawGrid();
}

// Other patterns via dropdown
function patternInfect(){
  const val=document.getElementById("patternSelect").value;
  initGrid();
  if(val==="checkerboard"){for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){if((r+c)%2===0) grid[r][c]=true;}}}
  if(val==="diagonals"){for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){if((r-c)%5===0) grid[r][c]=true;}}}
  if(val==="primes"){function isPrime(n){if(n<2) return false; for(let i=2;i*i<=n;i++) if(n%i===0) return false; return true;}
  for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){if(isPrime(r*cols+c)) grid[r][c]=true;}}}
  rounds=0; document.getElementById("roundsLabelDisplay").textContent=rounds; drawGrid();
}

// Click/touch toggle
function toggleCell(x,y){ const size=cellSize(); const c=Math.floor(x/size), r=Math.floor(y/size); if(r>=0 && r<rows && c>=0 && c<cols){grid[r][c]=!grid[r][c]; drawGrid();} }
canvas.addEventListener("click",e=>{ const rect=canvas.getBoundingClientRect(); toggleCell(e.clientX-rect.left,e.clientY-rect.top); });
canvas.addEventListener("touchstart",e=>{ e.preventDefault(); const rect=canvas.getBoundingClientRect(); const touch=e.touches[0]; toggleCell(touch.clientX-rect.left,touch.clientY-rect.top); }, {passive:false});

// Image upload infection
document.getElementById("imageUpload").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(!file) return;
  const img = new Image();
  img.onload = ()=>{
    initGrid();
    const temp = document.createElement("canvas");
    temp.width = cols; temp.height = rows;
    const tctx = temp.getContext("2d");
    tctx.drawImage(img,0,0,cols,rows);
    const data = tctx.getImageData(0,0,cols,rows).data;
    for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){
      const idx = (r*cols+c)*4;
      const brightness = 0.299*data[idx]+0.587*data[idx+1]+0.114*data[idx+2];
      if(brightness<128) grid[r][c]=true;
    }}
    rounds=0; document.getElementById("roundsLabelDisplay").textContent=rounds; drawGrid();
  };
  img.src = URL.createObjectURL(file);
});

// Sliders
document.getElementById("rowsSlider").addEventListener("input",e=>{ rows=+e.target.value; document.getElementById("rowsLabel").textContent=rows; initGrid(); });
document.getElementById("colsSlider").addEventListener("input",e=>{ cols=+e.target.value; document.getElementById("colsLabel").textContent=cols; initGrid(); });
document.getElementById("probSlider").addEventListener("input",e=>{ prob=+e.target.value; document.getElementById("probLabel").textContent=prob.toFixed(2); });
document.getElementById("thresholdSlider").addEventListener("input",e=>{ threshold=+e.target.value; document.getElementById("thresholdLabel").textContent=threshold; });
document.getElementById("speedSlider").addEventListener("input",e=>{ speed=+e.target.value; document.getElementById("speedLabel").textContent=speed; if(running){ clearInterval(infectionInterval); infectionInterval=setInterval(stepInfection,speed); } });

window.addEventListener("resize", drawGrid); 
initGrid();
</script>
</body>
</html>

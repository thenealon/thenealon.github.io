<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
<title>Cyclic Pianos</title>
<style>
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #4a4a4a; 
    margin: 0;
    padding: 10px;
    touch-action: none; 
    user-select: none;
    -webkit-tap-highlight-color: transparent; 
  }
  header {
    text-align: center;
    color: white;
    margin-bottom: 15px;
  }
  header h1 { margin: 0; font-size: 1.6rem; }
  header p { margin: 4px 0; font-size: 0.95rem; opacity: 0.9; }
  header a { color: #aadaff; text-decoration: none; }
  
  #controls {
    background: #fdfdfd;
    padding: 10px 15px;
    border-radius: 12px;
    margin-bottom: 15px;
    text-align: center;
    box-shadow: 0 6px 15px rgba(0,0,0,0.25);
    width: 100%;
    max-width: 600px;
    box-sizing: border-box;
  }
  .control-row {
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .control-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #eee;
  }
  #canvas-container {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 10px;
    justify-content: center;
    align-items: flex-start;
    width: 100%;
    max-width: 900px;
  }
  .canvas-wrapper {
    flex: 1 1 50%;
    display: flex;
    justify-content: center;
    max-width: 400px;
  }
  canvas {
    background: transparent;
    cursor: pointer;
    outline: none; 
    filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
  }
  #graph {
    cursor: default; 
  }
  .hint {
    margin-top: 8px;
    font-size: 0.8em;
    color: #ccc;
    font-style: italic;
  }
  .sustain-active {
    background-color: #ffe6eb !important;
    border-radius: 6px;
    padding: 2px 6px;
  }
</style>
</head>
<body>

  <header>
    <h1>Cyclic Pianos</h1>
    <p>N. Bushaw &mdash; Bridges2026 &mdash; <span id="contact"></span></p>
  </header>

  <div id="controls">
    <div class="control-row">
      <label>Notes (N): <strong id="n-val">12</strong></label>
      <input type="range" id="n-slider" min="5" max="31" value="12">
    </div>
    <div class="control-row">
      <label>Black Keys (K): <strong id="k-val">5</strong></label>
      <input type="range" id="k-slider" min="1" max="11" value="5">
    </div>
    
    <div class="control-group">
      <div>
        <input type="checkbox" id="qwerty-toggle">
        <label for="qwerty-toggle" style="cursor:pointer; font-size: 0.9em;">QWERTY</label>
      </div>
      <div>
        <input type="checkbox" id="integer-toggle">
        <label for="integer-toggle" style="cursor:pointer; font-size: 0.9em;">Numbers</label>
      </div>
      <div>
        <input type="checkbox" id="distances-toggle" checked>
        <label for="distances-toggle" style="cursor:pointer; font-size: 0.9em;">Distances</label>
      </div>
      <div>
        <input type="checkbox" id="polygons-toggle" checked>
        <label for="polygons-toggle" style="cursor:pointer; font-size: 0.9em;">Polygons</label>
      </div>
      <div id="sustain-container">
        <input type="checkbox" id="sustain-toggle">
        <label for="sustain-toggle" style="cursor:pointer; font-size: 0.9em; font-weight: bold;">Sustain</label>
      </div>
      <div>
        <input type="checkbox" id="shepard-toggle">
        <label for="shepard-toggle" style="cursor:pointer; font-size: 0.9em; color: #d00; font-weight: bold;">Shepard</label>
      </div>
    </div>
    <div class="hint">Hold <strong>Spacebar</strong> to sustain. Toggle <strong>Shepard</strong> for the illusion.</div>
  </div>

  <div id="canvas-container">
    <div class="canvas-wrapper">
      <canvas id="keyboard" width="400" height="400" tabindex="0"></canvas>
    </div>
    <div class="canvas-wrapper">
      <canvas id="graph" width="400" height="400"></canvas>
    </div>
  </div>

  <script>
    // Obfuscate Email
    (function() {
      const u = "nobushaw";
      const d = "vcu.edu";
      document.getElementById('contact').innerHTML = `<a href="mailto:${u}@${d}">${u}@${d}</a>`;
    })();

    const canvas = document.getElementById('keyboard');
    const ctx = canvas.getContext('2d');
    const graphCanvas = document.getElementById('graph');
    const gCtx = graphCanvas.getContext('2d');

    const nSlider = document.getElementById('n-slider');
    const kSlider = document.getElementById('k-slider');
    const qwertyToggle = document.getElementById('qwerty-toggle');
    const integerToggle = document.getElementById('integer-toggle');
    const distancesToggle = document.getElementById('distances-toggle');
    const polygonsToggle = document.getElementById('polygons-toggle');
    const sustainToggle = document.getElementById('sustain-toggle');
    const sustainContainer = document.getElementById('sustain-container');
    const shepardToggle = document.getElementById('shepard-toggle');

    let N = 12, K = 5;
    let showQwerty = false, showInteger = false, showDistances = true, showPolygons = true;
    let keys = [], isBlackArr = []; 

    let audioCtx = null, audioUnlocked = false, nextVoiceId = 0;
    const activeVoices = new Map(), sustainedVoices = new Set();
    const pointerToVoice = new Map(), keyToVoice = new Map();
    const activePointers = new Set(), pressedKeys = new Set();
    let isSustainDown = false;

    const cx = 200, cy = 200, rWhite = 190, rBlack = 110, rHole = 35; 
    const gx = 200, gy = 200, rGraph = 160;
    const noteNames12 = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

    function unlockAudio() {
      if (audioUnlocked) return;
      // Latency Optimization: Set latencyHint to interactive
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
      const buffer = audioCtx.createBuffer(1, 1, 22050);
      const source = audioCtx.createBufferSource();
      source.buffer = buffer; source.connect(audioCtx.destination); source.start(0);
      if (audioCtx.state === 'suspended') audioCtx.resume();
      audioUnlocked = true;
      document.removeEventListener('pointerdown', unlockAudio);
      document.removeEventListener('keydown', unlockAudio);
    }
    document.addEventListener('pointerdown', unlockAudio);
    document.addEventListener('keydown', unlockAudio);

    function updateKeyboard() {
      N = parseInt(nSlider.value);
      kSlider.max = N - 1;
      if (parseInt(kSlider.value) >= N) kSlider.value = N - 1;
      K = parseInt(kSlider.value);
      showQwerty = qwertyToggle.checked;
      showInteger = integerToggle.checked;
      showDistances = distancesToggle.checked;
      showPolygons = polygonsToggle.checked;

      document.getElementById('n-val').innerText = N;
      document.getElementById('k-val').innerText = K;

      isBlackArr = Array(N).fill(false);
      let standardPianoMap = null;
      if (N === 12 && K === 5) {
        [1, 3, 6, 8, 10].forEach(i => isBlackArr[i] = true);
        standardPianoMap = {0:'a', 1:'w', 2:'s', 3:'e', 4:'d', 5:'f', 6:'t', 7:'g', 8:'y', 9:'h', 10:'u', 11:'j'};
      } else {
        for (let i = 0; i < K; i++) isBlackArr[(Math.floor((i * N) / K) + 1) % N] = true;
      }

      const W = N - K, angleW = (Math.PI * 2) / W, blackWidth = angleW * 0.55, rotationOffset = -angleW / 2;
      const fW = ['a','s','d','f','g','h','j','k','l',';',"'"], fB = ['w','e','r','t','y','u','i','o','p','[',']'];
      keys = [];
      let currentWhite = 0, wIdx = 0, bIdx = 0;

      for (let i = 0; i < N; i++) {
        let ql = standardPianoMap ? standardPianoMap[i] : (isBlackArr[i] ? fB[bIdx++ % 11] : fW[wIdx++ % 11]);
        if (isBlackArr[i]) {
          keys.push({ index: i, isBlack: true, center: currentWhite * angleW + rotationOffset, width: blackWidth, radius: rBlack, qwertyLabel: ql });
        } else {
          keys.push({ index: i, isBlack: false, start: currentWhite * angleW + rotationOffset, end: (currentWhite + 1) * angleW + rotationOffset, whiteIndex: currentWhite, radius: rWhite, qwertyLabel: ql });
          currentWhite++;
        }
      }
      draw();
    }

    function drawWedge(radius, logicalStart, logicalEnd, color) {
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, radius, Math.PI / 2 - logicalEnd, Math.PI / 2 - logicalStart);
      ctx.closePath(); ctx.fillStyle = color; ctx.fill();
      ctx.strokeStyle = '#222'; ctx.lineWidth = 2.5; ctx.stroke();
    }

    function drawLabels() {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'bold 15px Georgia, serif'; 
      for (let key of keys) {
        const angle = key.isBlack ? key.center : (key.start + key.end) / 2;
        const tx = cx + Math.cos(Math.PI/2 - angle) * (key.isBlack ? key.radius - 22 : key.radius - 32);
        const ty = cy + Math.sin(Math.PI/2 - angle) * (key.isBlack ? key.radius - 22 : key.radius - 32);
        ctx.fillStyle = key.isBlack ? '#f0f0f0' : '#333';
        let lines = [];
        if (showInteger) lines.push(N === 12 ? noteNames12[key.index] : key.index);
        if (showQwerty) lines.push(key.qwertyLabel.toUpperCase());
        if (lines.length === 1) ctx.fillText(lines[0], tx, ty);
        else if (lines.length === 2) { ctx.fillText(lines[0], tx, ty - 8); ctx.fillText(lines[1], tx, ty + 8); }
      }
    }

    function drawGraph(activeIndices) {
      gCtx.clearRect(0, 0, 400, 400);
      gCtx.beginPath();
      for (let i = 0; i <= N; i++) {
        const a = Math.PI / 2 - (i % N) * (Math.PI * 2) / N;
        const px = gx + Math.cos(a) * rGraph, py = gy + Math.sin(a) * rGraph;
        i === 0 ? gCtx.moveTo(px, py) : gCtx.lineTo(px, py);
      }
      gCtx.strokeStyle = '#222'; gCtx.lineWidth = 2.5; gCtx.stroke();

      const activeArr = Array.from(activeIndices).sort((a, b) => a - b);
      if (activeArr.length > 1) {
        if (showPolygons) {
          gCtx.beginPath();
          for (let i = 0; i < activeArr.length; i++) {
            const u = activeArr[i], a = Math.PI / 2 - u * (Math.PI * 2) / N;
            const px = gx + Math.cos(a) * rGraph, py = gy + Math.sin(a) * rGraph;
            i === 0 ? gCtx.moveTo(px, py) : gCtx.lineTo(px, py);
          }
          if (activeArr.length >= 3) { gCtx.closePath(); gCtx.fillStyle = 'rgba(255, 51, 102, 0.3)'; gCtx.fill(); }
          gCtx.strokeStyle = '#ff3366'; gCtx.lineWidth = 2.5; gCtx.stroke();
        }
        if (showDistances) {
          activeArr.forEach((u, i) => {
            activeArr.slice(i+1).forEach(v => {
              const a1 = Math.PI/2 - u*(Math.PI*2)/N, a2 = Math.PI/2 - v*(Math.PI*2)/N;
              const x1 = gx+Math.cos(a1)*rGraph, y1 = gy+Math.sin(a1)*rGraph, x2 = gx+Math.cos(a2)*rGraph, y2 = gy+Math.sin(a2)*rGraph;
              gCtx.beginPath(); gCtx.moveTo(x1, y1); gCtx.lineTo(x2, y2);
              gCtx.strokeStyle = '#ff3366'; gCtx.stroke();
              const dist = Math.min(Math.abs(u-v), N-Math.abs(u-v));
              gCtx.beginPath(); gCtx.arc((x1+x2)/2, (y1+y2)/2, 8, 0, Math.PI*2); gCtx.fillStyle='#fff'; gCtx.fill();
              gCtx.strokeStyle='#ff3366'; gCtx.lineWidth=1.5; gCtx.stroke();
              gCtx.fillStyle='#ff3366'; gCtx.font='bold 10px sans-serif'; gCtx.textAlign='center'; gCtx.fillText(dist, (x1+x2)/2, (y1+y2)/2+3);
            });
          });
        }
      }

      const vRad = Math.max(6, Math.min(18, (rGraph * Math.PI / N) * 0.7));
      for (let i = 0; i < N; i++) {
        const a = Math.PI / 2 - i * (Math.PI * 2) / N, px = gx + Math.cos(a) * rGraph, py = gy + Math.sin(a) * rGraph;
        gCtx.beginPath(); gCtx.arc(px, py, vRad, 0, Math.PI * 2);
        const active = activeIndices.has(i);
        gCtx.fillStyle = isBlackArr[i] ? (active ? '#777' : '#222') : (active ? '#aadaff' : '#fff');
        gCtx.fill(); gCtx.strokeStyle = active ? (isBlackArr[i] ? '#fff' : '#0055ff') : '#222';
        gCtx.lineWidth = active ? 3 : 2; gCtx.stroke();
        if (vRad >= 10) {
          gCtx.fillStyle = isBlackArr[i] ? (active ? '#fff' : '#ddd') : (active ? '#000' : '#444');
          gCtx.font = `bold ${Math.max(9, vRad - 4)}px sans-serif`; gCtx.textAlign = 'center'; gCtx.fillText(i, px, py + 4);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, 400, 400);
      const activeIndices = new Set(Array.from(activeVoices.values()).map(v => v.index));
      keys.filter(k => !k.isBlack).forEach(k => drawWedge(k.radius, k.start, k.end, activeIndices.has(k.index) ? '#d9eaff' : '#fff'));
      keys.filter(k => k.isBlack).forEach(k => drawWedge(k.radius, k.center-k.width/2, k.center+k.width/2, activeIndices.has(k.index) ? '#555' : '#222'));
      if (showQwerty || showInteger) drawLabels();
      ctx.globalCompositeOperation = 'destination-out'; ctx.beginPath(); ctx.arc(cx, cy, rHole, 0, Math.PI*2); ctx.fill();
      ctx.globalCompositeOperation = 'source-over'; ctx.beginPath(); ctx.arc(cx, cy, rHole, 0, Math.PI*2); ctx.strokeStyle = '#222'; ctx.lineWidth = 3; ctx.stroke();
      drawGraph(activeIndices);
    }

    // --- Audio Logic ---

    function startVoice(index) {
      if (!audioUnlocked) unlockAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const masterGain = audioCtx.createGain();
      masterGain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      masterGain.gain.setValueAtTime(0, now);
      
      // Balancing & Buffer Optimization: 0.02s ramp helps sync threads
      const targetVolume = shepardToggle.checked ? 0.05 : 0.15;
      masterGain.gain.linearRampToValueAtTime(targetVolume, now + 0.02);

      const oscillators = [];
      const baseFreq = 261.63 * Math.pow(2, index / N);

      if (shepardToggle.checked) {
        for (let i = -3; i <= 3; i++) {
          const freq = baseFreq * Math.pow(2, i);
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          const lfreq = Math.log2(freq / 261.63);
          const volume = Math.exp(-0.5 * Math.pow(lfreq / 1.5, 2)); 
          osc.type = 'sine';
          osc.frequency.value = freq;
          g.gain.value = volume;
          osc.connect(g);
          g.connect(masterGain);
          osc.start(now);
          oscillators.push(osc);
        }
      } else {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = baseFreq;
        osc.connect(masterGain);
        osc.start(now);
        oscillators.push(osc);
      }

      const voiceId = nextVoiceId++;
      activeVoices.set(voiceId, { oscillators, gain: masterGain, index });
      requestAnimationFrame(draw); 
      return voiceId;
    }

    function stopVoice(voiceId) {
      if (!activeVoices.has(voiceId)) return;
      const { oscillators, gain } = activeVoices.get(voiceId);
      const now = audioCtx.currentTime;
      gain.gain.cancelScheduledValues(now);
      gain.gain.setValueAtTime(gain.gain.value, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
      oscillators.forEach(o => o.stop(now + 0.4));
      activeVoices.delete(voiceId);
      sustainedVoices.delete(voiceId);
      requestAnimationFrame(draw);
    }

    function releaseVoice(voiceId) {
      if (isSustainDown) sustainedVoices.add(voiceId);
      else stopVoice(voiceId);
    }

    function handleSustainChange(active) {
      isSustainDown = active; sustainToggle.checked = active;
      if (active) sustainContainer.classList.add('sustain-active');
      else {
        sustainContainer.classList.remove('sustain-active');
        const held = new Set([...pointerToVoice.values(), ...keyToVoice.values()]);
        sustainedVoices.forEach(id => { if (!held.has(id)) stopVoice(id); });
      }
    }

    function getIndexFromClick(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (400/rect.width) - cx, y = (e.clientY - rect.top) * (400/rect.height) - cy;
      const dist = Math.sqrt(x*x + y*y);
      if (dist < rHole) return -1;
      let ang = Math.PI/2 - Math.atan2(y, x);
      if (ang < 0) ang += Math.PI*2; if (ang >= Math.PI*2) ang -= Math.PI*2;
      if (dist <= rBlack) {
        for (let k of keys) if (k.isBlack) {
          let d = Math.abs(ang - k.center); if (d > Math.PI) d = 2*Math.PI - d;
          if (d <= k.width/2) return k.index;
        }
      }
      if (dist <= rWhite) {
        const W = N-K, aW = (Math.PI*2)/W, off = -aW/2;
        let gA = ang - off; if (gA < 0) gA += Math.PI*2; if (gA >= Math.PI*2) gA -= Math.PI*2;
        const target = Math.floor(gA / aW);
        for (let k of keys) if (!k.isBlack && k.whiteIndex === target) return k.index;
      }
      return -1;
    }

    canvas.addEventListener('pointerdown', (e) => {
      activePointers.add(e.pointerId); canvas.setPointerCapture(e.pointerId);
      const idx = getIndexFromClick(e); if (idx !== -1) pointerToVoice.set(e.pointerId, startVoice(idx));
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!activePointers.has(e.pointerId)) return;
      const nIdx = getIndexFromClick(e), oVid = pointerToVoice.get(e.pointerId);
      const cIdx = oVid !== undefined ? activeVoices.get(oVid).index : -1;
      if (nIdx !== cIdx) {
        if (oVid !== undefined) { releaseVoice(oVid); pointerToVoice.delete(e.pointerId); }
        if (nIdx !== -1) pointerToVoice.set(e.pointerId, startVoice(nIdx));
      }
    });
    canvas.addEventListener('pointerup', (e) => {
      activePointers.delete(e.pointerId); const vid = pointerToVoice.get(e.pointerId);
      if (vid !== undefined) { releaseVoice(vid); pointerToVoice.delete(e.pointerId); }
    });

    window.addEventListener('keydown', (e) => {
      if (e.repeat || e.metaKey || e.ctrlKey) return;
      if (e.key === ' ') { handleSustainChange(true); e.preventDefault(); return; }
      const matched = keys.find(k => k.qwertyLabel === e.key.toLowerCase());
      if (matched && !pressedKeys.has(e.key.toLowerCase())) {
        pressedKeys.add(e.key.toLowerCase());
        keyToVoice.set(e.key.toLowerCase(), startVoice(matched.index));
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === ' ') { handleSustainChange(false); return; }
      const char = e.key.toLowerCase();
      if (pressedKeys.has(char)) {
        pressedKeys.delete(char); const vid = keyToVoice.get(char);
        if (vid !== undefined) { releaseVoice(vid); keyToVoice.delete(char); }
      }
    });

    nSlider.oninput = updateKeyboard; kSlider.oninput = updateKeyboard;
    qwertyToggle.onchange = updateKeyboard; integerToggle.onchange = updateKeyboard;
    distancesToggle.onchange = updateKeyboard; polygonsToggle.onchange = updateKeyboard;
    sustainToggle.onchange = (e) => handleSustainChange(e.target.checked);
    updateKeyboard();
  </script>
</body>
</html>

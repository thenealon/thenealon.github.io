<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
<title>Circular Keyboard & Cycle Graph</title>
<style>
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #4a4a4a; 
    margin: 0;
    padding: 20px;
    touch-action: none; 
    user-select: none;
    -webkit-tap-highlight-color: transparent; 
  }
  #controls {
    background: #fdfdfd;
    padding: 15px 25px;
    border-radius: 12px;
    margin-bottom: 25px;
    text-align: center;
    box-shadow: 0 6px 15px rgba(0,0,0,0.25);
    width: 100%;
    max-width: 600px;
    box-sizing: border-box;
  }
  .control-row {
    margin-top: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
  }
  .control-group {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px solid #eee;
  }
  #canvas-container {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    align-items: center;
    width: 100%;
    max-width: 900px;
  }
  .canvas-wrapper {
    flex: 1 1 300px; /* Allow shrinking and growing */
    max-width: 400px;
    display: flex;
    justify-content: center;
  }
  canvas {
    background: transparent;
    cursor: pointer;
    outline: none; 
    filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1; /* Keeps it perfectly square when resizing */
  }
  #graph {
    cursor: default; 
  }
  .hint {
    margin-top: 10px;
    font-size: 0.85em;
    color: #666;
    font-style: italic;
  }
  .sustain-active {
    background-color: #ffe6eb !important;
    border-radius: 6px;
    padding: 2px 6px;
  }
</style>
</head>
<body>

  <div id="controls">
    <div>
      <label>Notes (N): <strong id="n-val">12</strong></label>
      <input type="range" id="n-slider" min="5" max="31" value="12">
    </div>
    <div class="control-row">
      <label>Black Keys (K): <strong id="k-val">5</strong></label>
      <input type="range" id="k-slider" min="1" max="11" value="5">
    </div>
    
    <div class="control-group">
      <div>
        <input type="checkbox" id="qwerty-toggle">
        <label for="qwerty-toggle" style="cursor:pointer; font-size: 0.9em;">QWERTY</label>
      </div>
      <div>
        <input type="checkbox" id="integer-toggle">
        <label for="integer-toggle" style="cursor:pointer; font-size: 0.9em;">Numbers</label>
      </div>
      <div>
        <input type="checkbox" id="distances-toggle" checked>
        <label for="distances-toggle" style="cursor:pointer; font-size: 0.9em;">Distances</label>
      </div>
      <div>
        <input type="checkbox" id="polygons-toggle" checked>
        <label for="polygons-toggle" style="cursor:pointer; font-size: 0.9em;">Polygons</label>
      </div>
      <div id="sustain-container">
        <input type="checkbox" id="sustain-toggle">
        <label for="sustain-toggle" style="cursor:pointer; font-size: 0.9em; font-weight: bold;">Sustain Pedal</label>
      </div>
    </div>
    <div class="hint">Or hold <strong>Spacebar</strong> to sustain notes on desktop.</div>
  </div>

  <div id="canvas-container">
    <div class="canvas-wrapper">
      <canvas id="keyboard" width="400" height="400" tabindex="0"></canvas>
    </div>
    <div class="canvas-wrapper">
      <canvas id="graph" width="400" height="400"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('keyboard');
    const ctx = canvas.getContext('2d');
    
    const graphCanvas = document.getElementById('graph');
    const gCtx = graphCanvas.getContext('2d');

    const nSlider = document.getElementById('n-slider');
    const kSlider = document.getElementById('k-slider');
    const qwertyToggle = document.getElementById('qwerty-toggle');
    const integerToggle = document.getElementById('integer-toggle');
    const distancesToggle = document.getElementById('distances-toggle');
    const polygonsToggle = document.getElementById('polygons-toggle');
    const sustainToggle = document.getElementById('sustain-toggle');
    const sustainContainer = document.getElementById('sustain-container');

    let N = 12;
    let K = 5;
    let showQwerty = false;
    let showInteger = false;
    let showDistances = true;
    let showPolygons = true;
    let keys = []; 
    let isBlackArr = []; 

    // --- Audio & Synthesis State ---
    let audioCtx = null;
    let audioUnlocked = false;
    let nextVoiceId = 0;
    
    const activeVoices = new Map();     
    const sustainedVoices = new Set();  
    
    const pointerToVoice = new Map();   
    const keyToVoice = new Map();       
    
    const activePointers = new Set(); 
    const pressedKeys = new Set(); 
    let isSustainDown = false;

    // --- Geometry ---
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const rWhite = 190;
    const rBlack = 110;
    const rHole = 35; 

    const gx = graphCanvas.width / 2;
    const gy = graphCanvas.height / 2;
    const rGraph = 160;

    const noteNames12 = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

    // --- iOS Audio Unlocker ---
    function unlockAudio() {
      if (audioUnlocked) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      // Play a silent buffer to wake up the iOS audio engine
      const buffer = audioCtx.createBuffer(1, 1, 22050);
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      source.start(0);
      
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      audioUnlocked = true;
      document.removeEventListener('pointerdown', unlockAudio);
      document.removeEventListener('keydown', unlockAudio);
    }
    
    document.addEventListener('pointerdown', unlockAudio);
    document.addEventListener('keydown', unlockAudio);


    function updateKeyboard() {
      N = parseInt(nSlider.value);
      kSlider.max = N - 1;
      if (parseInt(kSlider.value) >= N) kSlider.value = N - 1;
      K = parseInt(kSlider.value);
      
      showQwerty = qwertyToggle.checked;
      showInteger = integerToggle.checked;
      showDistances = distancesToggle.checked;
      showPolygons = polygonsToggle.checked;

      document.getElementById('n-val').innerText = N;
      document.getElementById('k-val').innerText = K;

      isBlackArr = Array(N).fill(false);
      let standardPianoMap = null;
      
      if (N === 12 && K === 5) {
        const standardBlacks = [1, 3, 6, 8, 10];
        standardBlacks.forEach(i => isBlackArr[i] = true);
        
        standardPianoMap = {
          0: 'a', 1: 'w', 2: 's', 3: 'e', 4: 'd', 5: 'f', 
          6: 't', 7: 'g', 8: 'y', 9: 'h', 10: 'u', 11: 'j'
        };
      } else {
        for (let i = 0; i < K; i++) {
          isBlackArr[(Math.floor((i * N) / K) + 1) % N] = true;
        }
      }

      const W = N - K;
      const angleW = (Math.PI * 2) / W;
      const blackWidth = angleW * 0.55; 
      const rotationOffset = -angleW / 2; 

      const fallbackWhiteLabels = ['a','s','d','f','g','h','j','k','l',';',"'"];
      const fallbackBlackLabels = ['w','e','r','t','y','u','i','o','p','[',']'];

      keys = [];
      let currentWhite = 0;
      let wLabelIdx = 0;
      let bLabelIdx = 0;

      for (let i = 0; i < N; i++) {
        let qwertyLabel = '';
        if (standardPianoMap) {
          qwertyLabel = standardPianoMap[i];
        } else {
          if (isBlackArr[i]) {
            qwertyLabel = fallbackBlackLabels[bLabelIdx % fallbackBlackLabels.length];
            bLabelIdx++;
          } else {
            qwertyLabel = fallbackWhiteLabels[wLabelIdx % fallbackWhiteLabels.length];
            wLabelIdx++;
          }
        }

        if (isBlackArr[i]) {
          const centerAngle = currentWhite * angleW + rotationOffset;
          keys.push({
            index: i,
            isBlack: true,
            center: centerAngle,
            width: blackWidth,
            radius: rBlack,
            qwertyLabel: qwertyLabel
          });
        } else {
          const startAngle = currentWhite * angleW + rotationOffset;
          const endAngle = (currentWhite + 1) * angleW + rotationOffset;
          keys.push({
            index: i,
            isBlack: false,
            start: startAngle,
            end: endAngle,
            whiteIndex: currentWhite,
            radius: rWhite,
            qwertyLabel: qwertyLabel
          });
          currentWhite++;
        }
      }

      draw();
    }

    function drawWedge(radius, logicalStart, logicalEnd, color) {
      const canvasStart = Math.PI / 2 - logicalEnd;
      const canvasEnd = Math.PI / 2 - logicalStart;
      
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, radius, canvasStart, canvasEnd);
      ctx.closePath();
      
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    function drawLabels() {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 15px Georgia, "Palatino Linotype", serif'; 

      for (let key of keys) {
        const angle = key.isBlack ? key.center : (key.start + key.end) / 2;
        const canvasAngle = Math.PI / 2 - angle;
        
        const rText = key.isBlack ? key.radius - 22 : key.radius - 32;
        
        const tx = cx + Math.cos(canvasAngle) * rText;
        const ty = cy + Math.sin(canvasAngle) * rText;
        
        ctx.fillStyle = key.isBlack ? '#f0f0f0' : '#333';

        let lines = [];
        
        if (showInteger) {
          if (N === 12) {
            lines.push(`${noteNames12[key.index]}`);
          } else {
            lines.push(`${key.index}`);
          }
        }
        
        if (showQwerty) {
          lines.push(key.qwertyLabel.toUpperCase());
        }

        if (lines.length === 1) {
          ctx.fillText(lines[0], tx, ty);
        } else if (lines.length === 2) {
          ctx.fillText(lines[0], tx, ty - 8);
          ctx.fillText(lines[1], tx, ty + 8);
        }
      }
    }

    function drawGraph(activeIndices) {
      gCtx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);
      
      gCtx.beginPath();
      for (let i = 0; i <= N; i++) {
        const angle = Math.PI / 2 - (i % N) * (Math.PI * 2) / N;
        const px = gx + Math.cos(angle) * rGraph;
        const py = gy + Math.sin(angle) * rGraph;
        if (i === 0) gCtx.moveTo(px, py);
        else gCtx.lineTo(px, py);
      }
      gCtx.strokeStyle = '#222';
      gCtx.lineWidth = 2.5;
      gCtx.stroke();

      const activeArr = Array.from(activeIndices).sort((a, b) => a - b);
      
      if (activeArr.length > 1) {
        let polyArea = 0;
        let cxSum = 0;
        let cySum = 0;

        if (showPolygons) {
          gCtx.beginPath();
          for (let i = 0; i < activeArr.length; i++) {
            const u = activeArr[i];
            const angle = Math.PI / 2 - u * (Math.PI * 2) / N;
            const px = gx + Math.cos(angle) * rGraph;
            const py = gy + Math.sin(angle) * rGraph;
            
            cxSum += px;
            cySum += py;
            
            if (i === 0) gCtx.moveTo(px, py);
            else gCtx.lineTo(px, py);

            const nextU = activeArr[(i + 1) % activeArr.length];
            const nextAngle = Math.PI / 2 - nextU * (Math.PI * 2) / N;
            polyArea += Math.sin(angle - nextAngle);
          }
          
          if (activeArr.length >= 3) {
            gCtx.closePath();
            gCtx.fillStyle = 'rgba(255, 51, 102, 0.3)';
            gCtx.fill();
          }
          
          gCtx.strokeStyle = '#ff3366';
          gCtx.lineWidth = 2.5;
          gCtx.stroke();
        }

        if (showDistances) {
          for (let i = 0; i < activeArr.length; i++) {
            for (let j = i + 1; j < activeArr.length; j++) {
              const u = activeArr[i];
              const v = activeArr[j];
              
              const a1 = Math.PI / 2 - u * (Math.PI * 2) / N;
              const a2 = Math.PI / 2 - v * (Math.PI * 2) / N;
              
              const px1 = gx + Math.cos(a1) * rGraph;
              const py1 = gy + Math.sin(a1) * rGraph;
              const px2 = gx + Math.cos(a2) * rGraph;
              const py2 = gy + Math.sin(a2) * rGraph;
              
              gCtx.beginPath();
              gCtx.moveTo(px1, py1);
              gCtx.lineTo(px2, py2);
              gCtx.strokeStyle = '#ff3366';
              gCtx.lineWidth = 2.5;
              gCtx.stroke();
            }
          }
        }

        if (showDistances) {
          gCtx.textAlign = 'center';
          gCtx.textBaseline = 'middle';
          gCtx.font = 'bold 12px sans-serif';

          for (let i = 0; i < activeArr.length; i++) {
            for (let j = i + 1; j < activeArr.length; j++) {
              const u = activeArr[i];
              const v = activeArr[j];
              const dist = Math.min(Math.abs(u - v), N - Math.abs(u - v));
              
              const a1 = Math.PI / 2 - u * (Math.PI * 2) / N;
              const a2 = Math.PI / 2 - v * (Math.PI * 2) / N;
              
              const px1 = gx + Math.cos(a1) * rGraph;
              const py1 = gy + Math.sin(a1) * rGraph;
              const px2 = gx + Math.cos(a2) * rGraph;
              const py2 = gy + Math.sin(a2) * rGraph;
              
              const mx = (px1 + px2) / 2;
              const my = (py1 + py2) / 2;
              
              gCtx.beginPath();
              gCtx.arc(mx, my, 8, 0, Math.PI * 2);
              gCtx.fillStyle = '#fff';
              gCtx.fill();
              gCtx.strokeStyle = '#ff3366';
              gCtx.lineWidth = 1.5;
              gCtx.stroke();
              
              gCtx.fillStyle = '#ff3366';
              gCtx.fillText(dist, mx, my);
            }
          }
        }

        if (showPolygons && activeArr.length >= 3) {
          const finalArea = Math.abs(polyArea * 0.5);
          const text = `A=${finalArea.toFixed(2)}`;
          
          const polyCX = cxSum / activeArr.length;
          const polyCY = cySum / activeArr.length;
          
          gCtx.font = 'bold 12px sans-serif';
          const textWidth = gCtx.measureText(text).width;
          
          gCtx.beginPath();
          gCtx.arc(polyCX - textWidth / 2, polyCY, 10, Math.PI / 2, Math.PI * 1.5);
          gCtx.arc(polyCX + textWidth / 2, polyCY, 10, Math.PI * 1.5, Math.PI / 2);
          gCtx.closePath();
          
          gCtx.fillStyle = '#fff';
          gCtx.fill();
          gCtx.strokeStyle = '#ff3366';
          gCtx.lineWidth = 1.5;
          gCtx.stroke();
          
          gCtx.fillStyle = '#ff3366';
          gCtx.textAlign = 'center';
          gCtx.textBaseline = 'middle';
          gCtx.fillText(text, polyCX, polyCY);
        }
      }

      const vRadius = Math.max(6, Math.min(18, (rGraph * Math.PI / N) * 0.7));
      
      for (let i = 0; i < N; i++) {
        const angle = Math.PI / 2 - i * (Math.PI * 2) / N;
        const px = gx + Math.cos(angle) * rGraph;
        const py = gy + Math.sin(angle) * rGraph;

        gCtx.beginPath();
        gCtx.arc(px, py, vRadius, 0, Math.PI * 2);
        
        const isBlack = isBlackArr[i];
        const isActive = activeIndices.has(i);

        if (isBlack) {
          gCtx.fillStyle = isActive ? '#777' : '#222';
        } else {
          gCtx.fillStyle = isActive ? '#aadaff' : '#fff';
        }
        gCtx.fill();
        
        gCtx.strokeStyle = isActive ? (isBlack ? '#fff' : '#0055ff') : '#222';
        gCtx.lineWidth = isActive ? 3 : 2;
        gCtx.stroke();

        if (vRadius >= 10) {
          gCtx.fillStyle = isBlack ? (isActive ? '#fff' : '#ddd') : (isActive ? '#000' : '#444');
          gCtx.font = `bold ${Math.max(9, vRadius - 4)}px sans-serif`;
          gCtx.textAlign = 'center';
          gCtx.textBaseline = 'middle';
          gCtx.fillText(i, px, py);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const activeIndices = new Set(Array.from(activeVoices.values()).map(v => v.index));

      for (let key of keys) {
        if (!key.isBlack) {
          const color = activeIndices.has(key.index) ? '#d9eaff' : '#fff';
          drawWedge(key.radius, key.start, key.end, color);
        }
      }

      for (let key of keys) {
        if (key.isBlack) {
          const color = activeIndices.has(key.index) ? '#555' : '#222';
          drawWedge(key.radius, key.center - key.width / 2, key.center + key.width / 2, color);
        }
      }

      if (showQwerty || showInteger) {
        drawLabels();
      }

      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(cx, cy, rHole, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.globalCompositeOperation = 'source-over';
      ctx.beginPath();
      ctx.arc(cx, cy, rHole, 0, Math.PI * 2);
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 3;
      ctx.stroke();

      drawGraph(activeIndices);
    }

    // --- Audio Voice Control ---

    function startVoice(index) {
      if (!audioUnlocked) unlockAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const freq = 261.63 * Math.pow(2, index / N);

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.value = freq;
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.1, now + 0.01);
      
      osc.start(now);

      const voiceId = nextVoiceId++;
      activeVoices.set(voiceId, { osc, gain, index });
      requestAnimationFrame(draw); 
      return voiceId;
    }

    function releaseVoice(voiceId) {
      if (!activeVoices.has(voiceId)) return;
      
      if (isSustainDown) {
        sustainedVoices.add(voiceId);
      } else {
        stopVoice(voiceId);
      }
    }

    function stopVoice(voiceId) {
      if (!activeVoices.has(voiceId)) return;
      const { osc, gain } = activeVoices.get(voiceId);
      const now = audioCtx.currentTime;
      
      gain.gain.cancelScheduledValues(now);
      gain.gain.setValueAtTime(gain.gain.value, now);
      
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
      osc.stop(now + 0.4);
      
      activeVoices.delete(voiceId);
      sustainedVoices.delete(voiceId);
      requestAnimationFrame(draw);
    }

    function handleSustainChange(active) {
      isSustainDown = active;
      sustainToggle.checked = active;
      
      if (active) {
        sustainContainer.classList.add('sustain-active');
      } else {
        sustainContainer.classList.remove('sustain-active');
        // Release all voices that are currently sustained, unless they are actively being held by a pointer or key
        const currentlyHeld = new Set();
        pointerToVoice.forEach(id => currentlyHeld.add(id));
        keyToVoice.forEach(id => currentlyHeld.add(id));
        
        sustainedVoices.forEach(voiceId => {
          if (!currentlyHeld.has(voiceId)) {
            stopVoice(voiceId);
          }
        });
      }
    }

    function getIndexFromClick(e) {
      // Adjusted to use canvas scaling
      const rect = canvas.getBoundingClientRect();
      // scaleX and scaleY map the physical DOM size to the internal 400x400 canvas resolution
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      
      const x = (e.clientX - rect.left) * scaleX - cx;
      const y = (e.clientY - rect.top) * scaleY - cy;
      const distance = Math.sqrt(x*x + y*y);
      
      if (distance < rHole) return -1; 
      
      let rawAngle = Math.atan2(y, x);
      let logicalAngle = Math.PI / 2 - rawAngle;
      if (logicalAngle < 0) logicalAngle += Math.PI * 2;
      if (logicalAngle >= Math.PI * 2) logicalAngle -= Math.PI * 2;

      if (distance <= rBlack) {
        for (let key of keys) {
          if (key.isBlack) {
            let diff = Math.abs(logicalAngle - key.center);
            if (diff > Math.PI) diff = 2 * Math.PI - diff;
            
            if (diff <= key.width / 2) {
              return key.index;
            }
          }
        }
      }

      if (distance <= rWhite) {
        const W = N - K;
        const angleW = (Math.PI * 2) / W;
        const rotationOffset = -angleW / 2;

        let gridAngle = logicalAngle - rotationOffset;
        if (gridAngle < 0) gridAngle += Math.PI * 2;
        if (gridAngle >= Math.PI * 2) gridAngle -= Math.PI * 2;
        
        const targetWhiteIndex = Math.floor(gridAngle / angleW);
        
        for (let key of keys) {
          if (!key.isBlack && key.whiteIndex === targetWhiteIndex) {
            return key.index;
          }
        }
      }

      return -1;
    }

    // --- Event Listeners ---

    canvas.addEventListener('pointerdown', (e) => {
      activePointers.add(e.pointerId);
      canvas.setPointerCapture(e.pointerId);
      
      const index = getIndexFromClick(e);
      if (index !== -1) {
        const voiceId = startVoice(index);
        pointerToVoice.set(e.pointerId, voiceId);
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!activePointers.has(e.pointerId)) return;

      const newIndex = getIndexFromClick(e);
      const oldVoiceId = pointerToVoice.get(e.pointerId);
      const activeVoice = oldVoiceId !== undefined ? activeVoices.get(oldVoiceId) : null;
      const currentIndex = activeVoice ? activeVoice.index : -1;

      if (newIndex !== currentIndex) {
        if (oldVoiceId !== undefined) {
          releaseVoice(oldVoiceId);
          pointerToVoice.delete(e.pointerId);
        }
        if (newIndex !== -1) {
          const newVoiceId = startVoice(newIndex);
          pointerToVoice.set(e.pointerId, newVoiceId);
        }
      }
    });

    canvas.addEventListener('pointerup', (e) => {
      activePointers.delete(e.pointerId);
      const voiceId = pointerToVoice.get(e.pointerId);
      if (voiceId !== undefined) {
        releaseVoice(voiceId);
        pointerToVoice.delete(e.pointerId);
      }
    });
    
    canvas.addEventListener('pointercancel', (e) => {
      activePointers.delete(e.pointerId);
      const voiceId = pointerToVoice.get(e.pointerId);
      if (voiceId !== undefined) {
        releaseVoice(voiceId);
        pointerToVoice.delete(e.pointerId);
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.repeat || e.metaKey || e.ctrlKey) return; 

      if (e.key === ' ') {
        handleSustainChange(true);
        e.preventDefault(); 
        return;
      }

      const keyChar = e.key.toLowerCase();
      const matchedKey = keys.find(k => k.qwertyLabel === keyChar);
      
      if (matchedKey && !pressedKeys.has(keyChar)) {
        pressedKeys.add(keyChar);
        const voiceId = startVoice(matchedKey.index);
        keyToVoice.set(keyChar, voiceId);
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === ' ') {
        handleSustainChange(false);
        return;
      }

      const keyChar = e.key.toLowerCase();
      if (pressedKeys.has(keyChar)) {
        pressedKeys.delete(keyChar);
        const voiceId = keyToVoice.get(keyChar);
        if (voiceId !== undefined) {
          releaseVoice(voiceId);
          keyToVoice.delete(keyChar);
        }
      }
    });

    sustainToggle.addEventListener('change', (e) => {
      handleSustainChange(e.target.checked);
    });

    nSlider.addEventListener('input', updateKeyboard);
    kSlider.addEventListener('input', updateKeyboard);
    qwertyToggle.addEventListener('change', updateKeyboard);
    integerToggle.addEventListener('change', updateKeyboard);
    distancesToggle.addEventListener('change', updateKeyboard);
    polygonsToggle.addEventListener('change', updateKeyboard);

    updateKeyboard();

  </script>
</body>
</html>

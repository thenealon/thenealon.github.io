# Rebuild the site whenever anything is pushed.
#
# What it does: captures a thumbnail for every new or changed app, then runs
# `python3 build.py`, which regenerates the public pages from the data files and
# the apps/ folder.  So you can add a web app by uploading one .html file to
# apps/ straight on github.com -- its gallery card and screenshot are automatic.
#
# It will NOT loop: commits made with the built-in GITHUB_TOKEN do not start
# another workflow run.

name: Build site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install screenshot tools
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test app screenshots
        if: github.event_name == 'pull_request'
        run: npm run screenshots -- --force

      - name: Capture changed app screenshots
        if: github.event_name == 'push'
        run: npm run screenshots

      - name: Regenerate the pages
        run: python3 build.py

      - name: Commit the result if it changed
        if: github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html more.html genealogy.html assets/genealogy-data.js assets/demos
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Rebuild site (automated)"
            git push
          fi
